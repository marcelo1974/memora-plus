<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="110" fill="none" stroke="#2DD4BF" stroke-opacity="0.25" stroke-width="6" />

  <!-- Outer Memory Ring / Laurel Arc -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#tealGrad)" stroke-width="4" stroke-dasharray="16 12" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="165" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.3" />

  <!-- Central M Glyph (Mnemosyne Architecture) -->
  <path d="M 140 370 L 140 160 L 256 280 L 372 160 L 372 370"
        fill="none"
        stroke="url(#tealGrad)"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Central Gold Memory Spark / Plus -->
  <path d="M 256 120 L 256 180 M 226 150 L 286 150"
        fill="none"
        stroke="url(#goldGrad)"
        stroke-width="16"
        stroke-linecap="round" />

  <!-- Synaptic Nodes (Memory Nodes) -->
  <circle cx="140" cy="160" r="16" fill="#FCD34D" />
  <circle cx="372" cy="160" r="16" fill="#FCD34D" />
  <circle cx="256" cy="280" r="18" fill="#2DD4BF" />
  <circle cx="140" cy="370" r="14" fill="#0D9488" />
  <circle cx="372" cy="370" r="14" fill="#0D9488" />
</svg>
